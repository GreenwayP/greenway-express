<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Greenway Express Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top right, rgba(8,127,91,0.08), transparent 30%),
        radial-gradient(circle at bottom left, rgba(37,99,235,0.06), transparent 28%),
        #f4f7f6;
      color: #1f2937;
    }

    .container {
      max-width: 1050px;
      margin: auto;
    }

    .header {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #087f5b, #075c45);
      color: white;
      padding: 28px;
      border-radius: 18px;
      margin-bottom: 22px;
      box-shadow: 0 8px 25px rgba(8,127,91,0.20);
    }

    .header::after {
      content: "✈";
      position: absolute;
      right: 25px;
      top: 10px;
      font-size: 75px;
      opacity: 0.10;
      transform: rotate(-15deg);
    }

    .header h1 {
      margin: 0 0 7px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .card {
      background: rgba(255,255,255,0.98);
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 17px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.07);
      border: 1px solid rgba(229,231,235,0.8);
    }

    h2 {
      color: #087f5b;
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 21px;
    }

    h3 {
      margin-top: 0;
      color: #087f5b;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 4px 0 15px;
      color: #374151;
      font-size: 17px;
      font-weight: bold;
    }

    .section-title span {
      width: 35px;
      height: 35px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #e7f7f1;
      font-size: 18px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .field {
      margin-bottom: 2px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      font-size: 14px;
      color: #374151;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      font-family: inherit;
      background: white;
      color: #1f2937;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #087f5b;
      box-shadow: 0 0 0 3px rgba(8,127,91,0.10);
    }

    .form-section {
      padding: 18px;
      margin-bottom: 18px;
      border-radius: 14px;
      background: #fbfdfc;
      border: 1px solid #e5eee9;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 11px 17px;
      font-size: 15px;
      cursor: pointer;
      background: #087f5b;
      color: white;
      margin-right: 6px;
      transition: transform .15s, opacity .15s;
    }

    button:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .logout-btn {
      background: #6b7280;
    }

    .edit-btn {
      background: #2563eb;
    }

    .delete-btn {
      background: #dc2626;
    }

    .approve-btn {
      background: #087f5b;
    }

    .decline-btn {
      background: #dc2626;
    }

    .secondary-btn {
      background: #475569;
    }

    .shipment-card {
      border: 1px solid #e5e7eb;
      padding: 18px;
      margin-bottom: 13px;
      border-radius: 13px;
      background: linear-gradient(145deg, #ffffff, #fafcfb);
    }

    .shipment-card strong {
      font-size: 19px;
      color: #087f5b;
    }

    .shipment-info {
      line-height: 1.8;
      margin-top: 10px;
      font-size: 14px;
    }

    .shipment-info b {
      color: #374151;
    }

    .button-row {
      margin-top: 15px;
    }

    .result {
      margin-top: 12px;
      font-weight: bold;
    }

    .success {
      color: #087f5b;
    }

    .error {
      color: #dc2626;
    }

    .approval-box {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 6px;
    }

    .pending {
      background: #fff7ed;
      color: #c2410c;
    }

    .approved {
      background: #ecfdf5;
      color: #047857;
    }

    .declined {
      background: #fef2f2;
      color: #b91c1c;
    }

    .tracking-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 13px;
      border-radius: 10px;
      margin-top: 13px;
    }

    .small-note {
      color: #6b7280;
      font-size: 13px;
      margin-top: 6px;
    }

    .divider {
      height: 1px;
      background: #e5e7eb;
      margin: 20px 0;
    }

    .empty {
      text-align: center;
      padding: 30px;
      color: #6b7280;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 12px;
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .header,
      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .header h1 {
        font-size: 23px;
      }

      button {
        margin-bottom: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">
    <h1>🚚 Greenway Express</h1>
    <p>Professional Admin Dashboard</p>
  </div>


  <!-- LOGIN -->

  <div class="card" id="loginCard">

    <h2>🔐 Admin Login</h2>

    <div class="field">
      <label>Email</label>
      <input
        type="email"
        id="adminEmail"
        placeholder="Your email"
      >
    </div>

    <br>

    <div class="field">
      <label>Password</label>
      <input
        type="password"
        id="adminPassword"
        placeholder="Your password"
      >
    </div>

    <br>

    <button type="button" onclick="adminLogin()">
      Login
    </button>

    <p id="loginResult" class="result"></p>

  </div>


  <!-- ADMIN AREA -->

  <div id="adminTools" style="display:none;">


    <!-- CREATE SHIPMENT -->

    <div class="card">

      <h2>📦 Create New Shipment</h2>

      <!-- BASIC SHIPMENT -->

      <div class="form-section">

        <div class="section-title">
          <span>🚚</span>
          Shipment Information
        </div>

        <div class="form-grid">

          <div class="field">
            <label>Tracking Number</label>
            <input
              type="text"
              id="newTrackingNumber"
              placeholder="Enter tracking number"
            >
          </div>

          <div class="field">
            <label>Status</label>
            <select id="newStatus">
              <option value="Pending">Pending</option>
              <option value="Processing">Processing</option>
              <option value="In Transit">In Transit</option>
              <option value="Out for Delivery">Out for Delivery</option>
              <option value="Delivered">Delivered</option>
            </select>
          </div>

          <div class="field">
            <label>Origin / Pickup Location</label>
            <input
              type="text"
              id="newOrigin"
              placeholder="Pickup location"
            >
          </div>

          <div class="field">
            <label>Destination Address</label>
            <input
              type="text"
              id="newDestination"
              placeholder="Full destination address"
            >
          </div>

          <div class="field">
            <label>Current Location</label>
            <input
              type="text"
              id="newLocation"
              placeholder="Current shipment location"
            >
          </div>

          <div class="field">
            <label>Estimated Delivery</label>
            <input
              type="date"
              id="newDelivery"
            >
          </div>

        </div>

      </div>


      <!-- SENDER -->

      <div class="form-section">

        <div class="section-title">
          <span>👤</span>
          Sender Details
        </div>

        <div class="form-grid">

          <div class="field">
            <label>Sender Name</label>
            <input
              type="text"
              id="newSenderName"
              placeholder="Full name"
            >
          </div>

          <div class="field">
            <label>Sender Phone</label>
            <input
              type="text"
              id="newSenderPhone"
              placeholder="Phone number"
            >
          </div>

          <div class="field full">
            <label>Sender Email</label>
            <input
              type="email"
              id="newSenderEmail"
              placeholder="Email address"
            >
          </div>

        </div>

      </div>


      <!-- RECEIVER -->

      <div class="form-section">

        <div class="section-title">
          <span>📍</span>
          Receiver Details
        </div>

        <div class="form-grid">

          <div class="field">
            <label>Receiver Name</label>
            <input
              type="text"
              id="newReceiverName"
              placeholder="Full name"
            >
          </div>

          <div class="field">
            <label>Receiver Phone</label>
            <input
              type="text"
              id="newReceiverPhone"
              placeholder="Phone number"
            >
          </div>

          <div class="field full">
            <label>Receiver Email</label>
            <input
              type="email"
              id="newReceiverEmail"
              placeholder="Email address"
            >
          </div>

        </div>

      </div>


      <!-- PACKAGE -->

      <div class="form-section">

        <div class="section-title">
          <span>📦</span>
          Package Details
        </div>

        <div class="form-grid">

          <div class="field">
            <label>Package Type</label>
            <select id="newPackageType">
              <option value="">Select package type</option>
              <option value="Parcel">Parcel</option>
              <option value="Box">Box</option>
              <option value="Envelope">Envelope</option>
              <option value="Groceries">Groceries</option>
              <option value="Toiletries">Toiletries</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label>Package Weight (kg)</label>
            <input
              type="number"
              id="newPackageWeight"
              placeholder="e.g. 5"
              min="0"
              step="0.01"
            >
          </div>

          <div class="field full">
            <label>Package Description</label>
            <textarea
              id="newPackageDescription"
              placeholder="Describe the package contents"
            ></textarea>
          </div>

          <div class="field">
            <label>Service Type</label>
            <select id="newServiceType">
              <option value="">Select service type</option>
              <option value="Standard Delivery">Standard Delivery</option>
              <option value="Express Delivery">Express Delivery</option>
              <option value="Priority Delivery">Priority Delivery</option>
            </select>
          </div>

          <div class="field">
            <label>Order Total</label>
            <input
              type="number"
              id="newOrderTotal"
              placeholder="0.00"
              min="0"
              step="0.01"
            >
          </div>

          <div class="field full">
            <label>Order Items</label>
            <textarea
              id="newOrderItems"
              placeholder="Items included in the customer order"
            ></textarea>
          </div>

          <div class="field full">
            <label>Special Instructions</label>
            <textarea
              id="newSpecialInstructions"
              placeholder="Any special instructions"
            ></textarea>
          </div>

        </div>

      </div>


      <!-- APPROVAL -->

      <div class="form-section">

        <div class="section-title">
          <span>🛡️</span>
          Service Approval
        </div>

        <div class="field">
          <label>Approval Status</label>

          <select id="newApprovalStatus">
            <option value="Pending">Pending Approval</option>
            <option value="Approved">Approved</option>
            <option value="Declined">Declined</option>
          </select>
        </div>

        <br>

        <div class="field">
          <label>Decline Reason</label>

          <textarea
            id="newDeclineReason"
            placeholder="Only use this when declining a shipment"
          ></textarea>
        </div>

      </div>


      <button
        type="button"
        onclick="createShipment()"
      >
        + Create Shipment
      </button>

      <p id="createResult" class="result"></p>

    </div>


    <!-- ALL SHIPMENTS -->

    <div class="card">

      <h2>📋 All Shipments</h2>

      <div id="allShipments">
        Loading shipments...
      </div>

    </div>


    <!-- SHIPMENT MANAGEMENT -->

    <div class="card">

      <h2>🔎 Shipment Management</h2>

      <input
        type="text"
        id="trackingNumber"
        placeholder="Enter tracking number"
      >

      <br><br>

      <button
        type="button"
        onclick="findShipment()"
      >
        Find Shipment
      </button>

      <button
        type="button"
        class="logout-btn"
        onclick="adminLogout()"
      >
        🚪 Logout
      </button>

      <div id="shipmentResult"></div>

    </div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseClient = supabase.createClient(
  "https://zrmelabkasdnockpaylj.supabase.co",
  "sb_publishable_QwtALZvU6GUH-tD2ewMPQQ_R3kmrmVt"
);


/* =========================
   SHOW / HIDE ADMIN
========================= */

function showAdminTools() {

  document.getElementById("adminTools")
    .style.display = "block";

  document.getElementById("loginCard")
    .style.display = "none";
}


function hideAdminTools() {

  document.getElementById("adminTools")
    .style.display = "none";

  document.getElementById("loginCard")
    .style.display = "block";
}


/* =========================
   LOGIN
========================= */

async function adminLogin() {

  const email =
    document.getElementById("adminEmail")
      .value.trim();

  const password =
    document.getElementById("adminPassword")
      .value;

  const loginResult =
    document.getElementById("loginResult");

  if (!email || !password) {

    loginResult.textContent =
      "Please enter your email and password.";

    return;
  }

  loginResult.textContent =
    "Logging in...";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });

  if (error) {

    console.error(error);

    loginResult.textContent =
      "Login failed: " + error.message;

    hideAdminTools();

    return;
  }

  showAdminTools();

  loadAllShipments();
}


/* =========================
   SESSION
========================= */

async function checkAdminSession() {

  const { data, error } =
    await supabaseClient.auth.getSession();

  if (error) {

    console.error(
      "Session check failed:",
      error
    );

    hideAdminTools();

    return;
  }

  if (data.session) {

    showAdminTools();

    loadAllShipments();

  } else {

    hideAdminTools();

  }
}


/* =========================
   LOGOUT
========================= */

async function adminLogout() {

  const { error } =
    await supabaseClient.auth.signOut();

  const loginResult =
    document.getElementById("loginResult");

  if (error) {

    loginResult.textContent =
      "Logout failed: " + error.message;

    return;
  }

  hideAdminTools();

  loginResult.textContent =
    "Logged out successfully.";

  document.getElementById("adminEmail").value = "";
  document.getElementById("adminPassword").value = "";
}


/* =========================
   CREATE SHIPMENT
========================= */

async function createShipment() {

  const trackingNumber =
    document.getElementById("newTrackingNumber")
      .value.trim();

  const status =
    document.getElementById("newStatus")
      .value;

  const origin =
    document.getElementById("newOrigin")
      .value.trim();

  const destination =
    document.getElementById("newDestination")
      .value.trim();

  const currentLocation =
    document.getElementById("newLocation")
      .value.trim();

  const estimatedDelivery =
    document.getElementById("newDelivery")
      .value || null;

  const senderName =
    document.getElementById("newSenderName")
      .value.trim();

  const senderPhone =
    document.getElementById("newSenderPhone")
      .value.trim();

  const senderEmail =
    document.getElementById("newSenderEmail")
      .value.trim();

  const receiverName =
    document.getElementById("newReceiverName")
      .value.trim();

  const receiverPhone =
    document.getElementById("newReceiverPhone")
      .value.trim();

  const receiverEmail =
    document.getElementById("newReceiverEmail")
      .value.trim();

  const orderItems =
    document.getElementById("newOrderItems")
      .value.trim();

  const orderTotalValue =
    document.getElementById("newOrderTotal")
      .value;

  const packageDescription =
    document.getElementById("newPackageDescription")
      .value.trim();

  const packageType =
    document.getElementById("newPackageType")
      .value;

  const packageWeightValue =
    document.getElementById("newPackageWeight")
      .value;

  const serviceType =
    document.getElementById("newServiceType")
      .value;

  const specialInstructions =
    document.getElementById("newSpecialInstructions")
      .value.trim();

  const approvalStatus =
    document.getElementById("newApprovalStatus")
      .value;

  const declineReason =
    document.getElementById("newDeclineReason")
      .value.trim();

  const createResult =
    document.getElementById("createResult");


  if (
    !trackingNumber ||
    !status ||
    !origin ||
    !destination
  ) {

    createResult.className =
      "result error";

    createResult.textContent =
      "Please enter the tracking number, status, origin and destination.";

    return;
  }


  createResult.className =
    "result";

  createResult.textContent =
    "Creating shipment...";


  const shipmentData = {

    tracking_number: trackingNumber,

    status: status,

    origin: origin,

    destination: destination,

    current_location: currentLocation || null,

    estimated_delivery: estimatedDelivery,

    sender_name: senderName || null,

    sender_phone: senderPhone || null,

    sender_email: senderEmail || null,

    receiver_name: receiverName || null,

    receiver_phone: receiverPhone || null,

    receiver_email: receiverEmail || null,

    order_items: orderItems || null,

    order_total:
      orderTotalValue === ""
        ? null
        : Number(orderTotalValue),

    package_description:
      packageDescription || null,

    package_type:
      packageType || null,

    package_weight:
      packageWeightValue === ""
        ? null
        : Number(packageWeightValue),

    service_type:
      serviceType || null,

    special_instructions:
      specialInstructions || null,

    approval_status:
      approvalStatus || "Pending",

    decline_reason:
      declineReason || null
  };


  const { error } =
    await supabaseClient
      .from("Shipments")
      .insert(shipmentData);


  if (error) {

    console.error(error);

    createResult.className =
      "result error";

    createResult.textContent =
      "Creation failed: " +
      error.message;

    return;
  }


  createResult.className =
    "result success";

  createResult.textContent =
    "Shipment created successfully! ✅";


  clearCreateForm();

  await loadAllShipments();
}


/* =========================
   CLEAR CREATE FORM
========================= */

function clearCreateForm() {

  const ids = [

    "newTrackingNumber",
    "newOrigin",
    "newDestination",
    "newLocation",
    "newDelivery",

    "newSenderName",
    "newSenderPhone",
    "newSenderEmail",

    "newReceiverName",
    "newReceiverPhone",
    "newReceiverEmail",

    "newOrderItems",
    "newOrderTotal",

    "newPackageDescription",
    "newPackageWeight",

    "newSpecialInstructions",
    "newDeclineReason"

  ];

  ids.forEach(id => {

    const element =
      document.getElementById(id);

    if (element) {
      element.value = "";
    }

  });

  document.getElementById("newPackageType").value = "";
  document.getElementById("newServiceType").value = "";
  document.getElementById("newApprovalStatus").value = "Pending";
  document.getElementById("newStatus").value = "Pending";
}


/* =========================
   LOAD ALL SHIPMENTS
========================= */

async function loadAllShipments() {

  const container =
    document.getElementById("allShipments");

  container.innerHTML =
    "Loading shipments...";


  const { data, error } =
    await supabaseClient
      .from("Shipments")
      .select("*")
      .order("tracking_number", {
        ascending: false
      });


  if (error) {

    console.error(error);

    container.innerHTML =
      "Failed to load shipments: " +
      error.message;

    return;
  }


  if (!data || data.length === 0) {

    container.innerHTML =
      '<div class="empty">📦 No shipments found.</div>';

    return;
  }


  container.innerHTML =
    data.map(shipment => {

      const approval =
        shipment.approval_status || "Pending";

      let approvalClass = "pending";

      if (approval === "Approved") {
        approvalClass = "approved";
      }

      if (approval === "Declined") {
        approvalClass = "declined";
      }


      return `

        <div class="shipment-card">

          <strong>
            🚚 ${escapeHtml(shipment.tracking_number)}
          </strong>

          <span class="status-badge ${approvalClass}">
            ${escapeHtml(approval)}
          </span>

          <div class="shipment-info">

            <b>Status:</b>
            ${escapeHtml(shipment.status || "—")}

            <br>

            <b>Origin:</b>
            ${escapeHtml(shipment.origin || "—")}

            <br>

            <b>Destination:</b>
            ${escapeHtml(shipment.destination || "—")}

            <br>

            <b>Current Location:</b>
            ${escapeHtml(shipment.current_location || "—")}

            <br>

            <b>Estimated Delivery:</b>
            ${escapeHtml(shipment.estimated_delivery || "—")}

            <br>

            <b>Sender:</b>
            ${escapeHtml(shipment.sender_name || "—")}

            <br>

            <b>Receiver:</b>
            ${escapeHtml(shipment.receiver_name || "—")}

            <br>

            <b>Package:</b>
            ${escapeHtml(shipment.package_type || "—")}

            <br>

            <b>Weight:</b>
            ${
              shipment.package_weight !== null &&
              shipment.package_weight !== undefined
              ? escapeHtml(String(shipment.package_weight)) + " kg"
              : "—"
            }

            <br>

            <b>Service:</b>
            ${escapeHtml(shipment.service_type || "—")}

          </div>


          ${
            approval === "Declined"
            ? `
              <div class="approval-box">
                <b>Decline Reason:</b><br>
                ${escapeHtml(shipment.decline_reason || "No reason provided.")}
              </div>
            `
            : ""
          }


          <div class="button-row">

            <button
              type="button"
              class="edit-btn"
              onclick="findShipment('${escapeAttribute(shipment.tracking_number)}')"
            >
              ✏️ Edit
            </button>


            ${
              approval !== "Approved"
              ? `
                <button
                  type="button"
                  class="approve-btn"
                  onclick="approveShipment('${escapeAttribute(shipment.tracking_number)}')"
                >
                  ✅ Approve
                </button>
              `
              : ""
            }


            ${
              approval !== "Declined"
              ? `
                <button
                  type="button"
                  class="decline-btn"
                  onclick="declineShipment('${escapeAttribute(shipment.tracking_number)}')"
                >
                  ❌ Decline
                </button>
              `
              : ""
            }


            <button
              type="button"
              class="delete-btn"
              onclick="deleteShipment('${escapeAttribute(shipment.tracking_number)}')"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

      `;

    }).join("");
}


/* =========================
   APPROVE SHIPMENT
========================= */

async function approveShipment(trackingNumber) {

  const confirmed =
    confirm(
      "Approve shipment " +
      trackingNumber +
      "?"
    );

  if (!confirmed) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("Shipments")
      .update({

        approval_status: "Approved",

        decline_reason: null

      })
      .eq(
        "tracking_number",
        trackingNumber
      );


  if (error) {

    console.error(error);

    alert(
      "Approval failed: " +
      error.message
    );

    return;
  }


  alert(
    "Shipment approved successfully! ✅"
  );


  await loadAllShipments();
}


/* =========================
   DECLINE SHIPMENT
========================= */

async function declineShipment(trackingNumber) {

  const reason =
    prompt(
      "Enter the reason for declining this shipment:"
    );


  if (reason === null) {
    return;
  }


  const cleanReason =
    reason.trim();


  if (!cleanReason) {

    alert(
      "Please enter a decline reason."
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("Shipments")
      .update({

        approval_status: "Declined",

        decline_reason: cleanReason

      })
      .eq(
        "tracking_number",
        trackingNumber
      );


  if (error) {

    console.error(error);

    alert(
      "Decline failed: " +
      error.message
    );

    return;
  }


  alert(
    "Shipment declined."
  );


  await loadAllShipments();
}


/* =========================
   DELETE SHIPMENT
========================= */

async function deleteShipment(trackingNumber) {

  const confirmed =
    confirm(
      "Are you sure you want to delete shipment " +
      trackingNumber +
      "?"
    );


  if (!confirmed) {
    return;
  }


  const { error } =
    await supabaseClient
      .from("Shipments")
      .delete()
      .eq(
        "tracking_number",
        trackingNumber
      );


  if (error) {

    console.error(error);

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  alert(
    "Shipment " +
    trackingNumber +
    " deleted successfully! ✅"
  );


  await loadAllShipments();
}

/* =========================
   UPDATE SHIPMENT
========================= */

async function updateShipment(
  oldTrackingNumber
) {

  const newTrackingNumber =
    document.getElementById("editTrackingNumber")
      .value.trim();

  if (!newTrackingNumber) {

    alert(
      "Tracking number cannot be empty."
    );

    return;
  }


  const orderTotalValue =
    document.getElementById("editOrderTotal")
      .value;

  const weightValue =
    document.getElementById("editPackageWeight")
      .value;


  const updateData = {

    tracking_number:
      newTrackingNumber,

    status:
      document.getElementById("editStatus")
        .value,

    origin:
      document.getElementById("editOrigin")
        .value.trim(),

    destination:
      document.getElementById("editDestination")
        .value.trim(),

    current_location:
      document.getElementById("editLocation")
        .value.trim() || null,

    estimated_delivery:
      document.getElementById("editDelivery")
        .value || null,

    sender_name:
      document.getElementById("editSenderName")
        .value.trim() || null,

    sender_phone:
      document.getElementById("editSenderPhone")
        .value.trim() || null,

    sender_email:
      document.getElementById("editSenderEmail")
        .value.trim() || null,

    receiver_name:
      document.getElementById("editReceiverName")
        .value.trim() || null,

    receiver_phone:
      document.getElementById("editReceiverPhone")
        .value.trim() || null,

    receiver_email:
      document.getElementById("editReceiverEmail")
        .value.trim() || null,

    order_items:
      document.getElementById("editOrderItems")
        .value.trim() || null,

    order_total:
      orderTotalValue === ""
        ? null
        : Number(orderTotalValue),

    package_description:
      document.getElementById("editPackageDescription")
        .value.trim() || null,

    package_type:
      document.getElementById("editPackageType")
        .value || null,

    package_weight:
      weightValue === ""
        ? null
        : Number(weightValue),

    service_type:
      document.getElementById("editServiceType")
        .value || null,

    special_instructions:
      document.getElementById("editSpecialInstructions")
        .value.trim() || null,

    approval_status:
      document.getElementById("editApprovalStatus")
        .value,

    decline_reason:
      document.getElementById("editDeclineReason")
        .value.trim() || null

  };


  const { error } =
    await supabaseClient
      .from("Shipments")
      .update(updateData)
      .eq(
        "tracking_number",
        oldTrackingNumber
      );


  if (error) {

    console.error(error);

    alert(
      "Update failed: " +
      error.message
    );

    return;
  }


  alert(
    "Shipment updated successfully! ✅"
  );


  document.getElementById("shipmentResult")
    .innerHTML = "";

  document.getElementById("trackingNumber")
    .value = newTrackingNumber;


  await loadAllShipments();
}


/* =========================
   SAFE HTML
========================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function escapeAttribute(value) {

  return escapeHtml(value);
}
