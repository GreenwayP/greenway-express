<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenway Express | Delivery & Consignment</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17231b;
    }

    header {
      background: #0b5d3b;
      color: white;
      padding: 22px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 15px;
    }

    .hero {
      background: white;
      padding: 45px 20px;
      text-align: center;
    }

    .hero h2 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #5c665f;
      margin-bottom: 25px;
    }

    .tracking-box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccd5cf;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #0b5d3b;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      display: none;
      text-align: left;
      background: #eef7f1;
      padding: 20px;
      border-radius: 10px;
      line-height: 1.8;
    }

    .services {
      padding: 40px 20px;
      text-align: center;
    }

    .services h2 {
      margin-bottom: 25px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .card h3 {
      margin-bottom: 10px;
      color: #0b5d3b;
    }

    footer {
      background: #123d2b;
      color: white;
      text-align: center;
      padding: 25px 15px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<header>
  <h1>Greenway Express</h1>
  <p>Fast • Safe • Reliable Delivery</p>
